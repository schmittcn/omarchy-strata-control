name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Patch rules
        run: python3 test_strata_profiles.py
      - name: Manifest
        # the same script the omarchy package installs; bump the tag with Omarchy
        run: |
          curl -fsSL https://raw.githubusercontent.com/basecamp/omarchy/v4.5.0/bin/omarchy-plugin-validate -o /tmp/validate
          bash /tmp/validate .
